name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Ein Deploy zur Zeit. Laufende Deploys nicht abbrechen, sonst landet ein
# halber Build auf der Seite.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Volle Historie: die Sitemap nimmt lastmod aus git log.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Wortlisten und Testvektoren stammen aus dem Python-Repo (oeffentlich,
      # kein Token noetig). Weicht die Kopie hier ab, faellt der Build - vorher
      # griff dieser Waechter nur, wenn jemand ihn lokal aufrief.
      - uses: actions/checkout@v5
        with:
          repository: michaelblaess/codename-generator
          path: python-repo
      - name: Daten gegen das Python-Repo pruefen
        run: node tools/sync-wordlists.mjs python-repo && git diff --exit-code -- src/data tests/vectors
      - name: Tests (vitest)
        run: npm test
      # Fremde Musik liegt nicht im Repo. Schlaegt das Holen fehl, geht die
      # Seite ohne Musikknopf live - das Skript beendet sich absichtlich mit 0.
      - name: Musik holen
        run: npm run musik
      - name: Build (astro)
        run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # Seit dem Livegang am 25.09.2026 deployt jeder Push auf main.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
