name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Ein Deploy zur Zeit. Laufende Deploys nicht abbrechen, sonst landet ein
# halber Build auf der Seite.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Tests (vitest)
        run: npm test
      # Fremde Musik liegt nicht im Repo. Schlaegt das Holen fehl, geht die
      # Seite ohne Musikknopf live - das Skript beendet sich absichtlich mit 0.
      - name: Musik holen
        run: npm run musik
      - name: Build (astro)
        run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # Solange das Repo privat ist, gibt es kein Pages - der Deploy scheitert dann
  # mit 404. Bis zum Livegang nur von Hand starten, Build und Tests laufen
  # trotzdem bei jedem Push.
  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
